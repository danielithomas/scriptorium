services:
  chatterbox-tts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - RUNTIME=${RUNTIME:-cpu}
    container_name: chatterbox-tts
    ports:
      - "${TTS_PORT:-8004}:8004"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./voices:/app/voices
      - ./reference_audio:/app/reference_audio
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - hf_cache:/app/hf_cache
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=1
    # GPU mode: uncomment this block alongside RUNTIME=nvidia in .env and
    # tts_engine.device: cuda in config.yaml. Without it the container has no
    # CUDA device and silently falls back to CPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  hf_cache:
